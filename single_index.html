    <!-- Animate.css -->

    <style>
        * {
            padding: 0;
            margin: 0;
            list-style: none;
            font-family: 'Montserrat', sans-serif;
            text-decoration: none;
        }

        body {
            overflow-x: hidden;
            background-color: #000;
        }

        main {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .text {
            display: flex;
            flex-direction: column;
            gap: 3px;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px 50px;
            max-width: 50%;
            border-radius: 10px;
            background: rgba(37, 37, 37, 0.16);
            gap: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .container > img.avatar {
            border-radius: 100%;
            border: 5px solid #CC9C0D;
            width: 125px;
            height: 125px;
            object-fit: cover;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            z-index: 1;
            /* Using a high-quality Dubai background from Unsplash */
            background: url('https://images.unsplash.com/photo-1512453979798-5ea266f8880c?q=80&w=2000'), #000000;
            background-position: center;
            background-size: cover;
            filter: sepia(100%) brightness(.2) contrast(.8) saturate(1.9);
        }

        .title {
            color: #fff;
            font-size: 2em;
            font-weight: 700;
        }

        .subscriber {
            color: #7D7F81;
            font-size: .9em;
        }

        .description {
            color: #FFFFFF;
        }

        @keyframes blinkShadow {
            0% {
                box-shadow: 0 0 5px 5px rgba(255, 222, 3, 0.5);
            }
            50% {
                box-shadow: 0 0 5px 5px rgba(255, 222, 3, 0);
            }
            100% {
                box-shadow: 0 0 5px 5px rgba(255, 222, 3, 0.5);
            }
        }

        .button {
            background: #FFDE03;
            color: #393939;
            font-weight: 800;
            padding: 12px 35px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: blinkShadow 1s infinite;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .button svg {
            width: 24px;
            height: 24px;
        }

        @media screen and (max-width: 500px) {
            .container {
                max-width: 80%;
                padding: 30px 20px;
            }
            .title {
                font-size: 1.5em;
            }
        }
    </style>

    <script>
        function getCookie(name) {
            const value = '; ' + document.cookie;
            const parts = value.split('; ' + name + '=');
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
        
        function add_fbp() {
            const fbpCookie = getCookie('_fbp');
            if (!fbpCookie) return;
            document.querySelectorAll('.redir, .button').forEach(function(el) {
                const href = el.getAttribute('href');
                if (href) {
                    el.setAttribute('href', href.includes('?') ? href + '&fbp=' + fbpCookie : href + '?fbp=' + fbpCookie);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', add_fbp);
    </script>
</head>
